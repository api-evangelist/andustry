name: Andustry
description: >-
  Andustry is an AI-native industrial equipment broker that streamlines sourcing
  and procurement for manufacturers. The platform combines AI-powered supplier
  discovery with manual qualification and commercial negotiation to source
  industrial machines (CNC mills, lathes, press brakes, laser cutters, robotic
  cells), machined/forged/cast parts, and robotics and electronics across Europe,
  China, India, and the United States. Clients hand off a sourcing need and
  Andustry returns a verified supplier shortlist within 24-48 hours, delivering an
  average of roughly 30% cost savings and 2x faster sourcing timelines on a
  commission-only basis with no subscription. Founded in 2026 (Y Combinator Spring
  2026 batch) by Het Dave and Johann Stuerken and operated as Andustry GmbH.
